<style>
  :root{
    --bg:#f7f3ec; --card:#ffffff; --ink:#2b2620; --sub:#7a7267;
    --accent:#c8593a; --accent-ink:#ffffff; --line:#e6ddd0;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1a17; --card:#26221d; --ink:#efe8de; --sub:#a89e90;
      --accent:#e0764f; --accent-ink:#1c1a17; --line:#3a352d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1a17; --card:#26221d; --ink:#efe8de; --sub:#a89e90;
    --accent:#e0764f; --accent-ink:#1c1a17; --line:#3a352d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100%;
  }
  .wrap{
    width:100%; max-width:480px; padding:24px 20px 40px;
    display:flex; flex-direction:column; gap:16px; flex:1;
  }
  h1{font-size:22px; margin:8px 0 0; letter-spacing:.02em;}
  .lead{color:var(--sub); font-size:14px; line-height:1.7; margin:0;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:20px; display:flex; flex-direction:column; gap:14px;
  }
  .progress{font-size:12px; color:var(--sub); letter-spacing:.05em;}
  .frame{
    width:100%; aspect-ratio:4/3; border-radius:12px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(135deg,#d8cdb8,#b7a98d); color:#4a4030;
    font-size:14px; padding:16px; position:relative;
  }
  .frame img{width:100%; height:100%; object-fit:cover; display:block;}
  .frame .ph{padding:0 12px;}
  .frame .ph b{display:block; font-size:22px; margin-bottom:6px;}
  input[type=text]{
    width:100%; padding:14px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:16px;
  }
  button{
    border:none; border-radius:10px; padding:14px; font-size:15px;
    font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .primary{background:var(--accent); color:var(--accent-ink);}
  .ghost{background:transparent; color:var(--sub); border:1px solid var(--line);}
  .row{display:flex; gap:10px;}
  .answer-box{
    border-top:1px dashed var(--line); padding-top:14px; display:flex;
    flex-direction:column; gap:8px;
  }
  .answer-box .real-title{font-size:18px; font-weight:700;}
  .answer-box .meta{font-size:13px; color:var(--sub);}
  .answer-box .desc{font-size:14px; line-height:1.8;}
  .your-guess{font-size:13px; color:var(--sub);}
  .community{
    border-top:1px dashed var(--line); padding-top:14px; display:flex;
    flex-direction:column; gap:8px;
  }
  .community-title{font-size:13px; font-weight:700; color:var(--sub);}
  .community-list{display:flex; flex-direction:column; gap:6px;}
  .community-empty{font-size:13px; color:var(--sub);}
  .community-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px;
  }
  .community-text{font-size:14px; word-break:break-word;}
  .like-btn{
    flex-shrink:0; display:flex; align-items:center; gap:4px;
    background:transparent; border:1px solid var(--line); border-radius:999px;
    padding:4px 10px; font-size:13px; color:var(--ink); cursor:pointer;
  }
  .like-btn:disabled{opacity:.7; cursor:default;}
  .hidden{display:none;}
  footer{font-size:11px; color:var(--sub); text-align:center; padding:8px 0 4px; line-height:1.6;}
  .start-hero{font-size:44px; text-align:center; margin:12px 0;}
</style>

<body>
<div class="wrap" id="app"></div>

<!-- みんなの回答機能用（Firestore）。設定手順は README.md を参照。
     未設定のままでも動作する（このセクションが自動的に非表示になるだけ）。 -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// ---- みんなの回答機能（Firestore）----
// Firebaseプロジェクトを作成し、下記を実際の設定値に置き換えると有効になる。
// プレースホルダーのままなら db は null のままになり、機能全体が自動的に無効化される。
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB9MCqXqs40GNGDrF7NElSuze187G2ktf0",
  authDomain: "ogiti-art.firebaseapp.com",
  projectId: "ogiti-art",
  storageBucket: "ogiti-art.firebasestorage.app",
  messagingSenderId: "229069201504",
  appId: "1:229069201504:web:ca9eac5d3aa0f1f724e305"
};
const MAX_ANSWER_LEN = 60;

let db = null;
try {
  if (FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY" && typeof firebase !== 'undefined') {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  }
} catch (e) {
  console.warn('Firebase init failed', e);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function hasLiked(docId){
  try { return localStorage.getItem('liked_' + docId) === '1'; } catch { return false; }
}
function markLiked(docId){
  try { localStorage.setItem('liked_' + docId, '1'); } catch {}
}

async function submitCommunityAnswer(workId, text){
  if (!db || !text) return;
  try {
    await db.collection('answers').add({
      workId,
      text: text.slice(0, MAX_ANSWER_LEN),
      likes: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {
    console.warn('failed to submit community answer', e);
  }
}

async function fetchCommunityAnswers(workId){
  if (!db) return [];
  try {
    const snap = await db.collection('answers').where('workId', '==', workId).limit(30).get();
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    list.sort((a, b) => (b.likes || 0) - (a.likes || 0));
    return list.slice(0, 5);
  } catch (e) {
    console.warn('failed to fetch community answers', e);
    return [];
  }
}

async function loadCommunityAnswers(workId){
  const listEl = document.getElementById('communityList');
  if (!listEl) return;
  const answers = await fetchCommunityAnswers(workId);
  if (answers.length === 0) {
    listEl.innerHTML = `<div class="community-empty">まだ回答がありません。最初の投稿者になろう。</div>`;
    return;
  }
  listEl.innerHTML = answers.map(a => `
    <div class="community-item">
      <span class="community-text">${escapeHtml(a.text)}</span>
      <button class="like-btn" data-id="${a.id}" ${hasLiked(a.id) ? 'disabled' : ''}>
        <span class="like-icon">${hasLiked(a.id) ? '❤️' : '🤍'}</span>
        <span class="like-count">${a.likes || 0}</span>
      </button>
    </div>
  `).join('');
  listEl.querySelectorAll('.like-btn').forEach(btn => {
    btn.onclick = async () => {
      const docId = btn.dataset.id;
      if (hasLiked(docId)) return;
      markLiked(docId);
      btn.disabled = true;
      btn.querySelector('.like-icon').textContent = '❤️';
      const countEl = btn.querySelector('.like-count');
      countEl.textContent = (parseInt(countEl.textContent, 10) || 0) + 1;
      try {
        await db.collection('answers').doc(docId).update({
          likes: firebase.firestore.FieldValue.increment(1)
        });
      } catch (e) {
        console.warn('failed to like', e);
      }
    };
  });
}

// ---- 作品データ ----
// image: ローカル画像パス（images/<id>.jpg）。ファイルが存在しない/読み込めない場合は
//        自動的にヒントのプレースホルダー表示にフォールバックする。
//        画像の取得方法は images/README.md と scripts/fetch-images.mjs を参照。
const WORKS = [

  },
  {
    id: "scream",
    image: "images/scream.jpg",

    hint: "人物が叫んでいるのか、耳をふさいでいるのか",
    desc: "実はこの人物自身が叫んでいるのではなく、「自然を貫く叫び声」を聞いて耳をふさいでいる場面。ムンクが夕焼けを見て感じた不安発作の記憶を描いたとされる。"
  },

    desc: "実在の人物か架空の人物か特定されておらず、物語性のない「トローニー」（人物習作）というジャンルの作品。ターバンや耳飾りは異国趣味の演出とされる。"
  },

    id: "great-wave",
    image: "images/great-wave.jpg",
    title: "神奈川沖浪裏",
    artist: "葛飾北斎", year: "1831年頃",
    hint: "主役は波か、それとも小さく描かれた山か",
    desc: "富嶽三十六景の一枚で、実は主題は荒波ではなく遠景の富士山。舟に乗る漁師たちは波にもまれながらも、その先に見える富士を仰いでいる構図になっている。"
  },
  {
    id: "saturn",
    image: "images/saturn.jpg",
    title: "我が子を食らうサトゥルヌス",

    desc: "ゴヤ晩年の「黒い絵」シリーズの一つ。自宅の壁に直接描かれていた作品で、後に息子に地位を奪われることを恐れたローマ神話の神サトゥルヌスの逸話を題材にしている。"

  {

  },
  {

    title: "民衆を導く自由の女神",

    hint: "女性が旗を掲げているが、実在の人物か寓意像か",
    desc: "1830年のフランス七月革命を題材にした作品で、中央の女性は実在の人物ではなく「自由」を擬人化した寓意像。半裸で描かれているのは古典彫刻の伝統を踏襲した表現とされる。"
  }

let idx = 0;
let guesses = [];
const app = document.getElementById('app');

function renderFrame(container, w){
  container.innerHTML = '';
  if (w.image) {
    const img = document.createElement('img');
    img.src = w.image;
    img.alt = w.title;
    img.loading = 'lazy';
    img.onerror = () => {
      img.remove();
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.innerHTML = `<b>🖼️</b>${w.hint}`;
      container.appendChild(ph);
    };
    container.appendChild(img);
  } else {
    container.innerHTML = `<div class="ph"><b>🖼️</b>${w.hint}</div>`;
  }
}

function renderStart(){
  app.innerHTML = `
    <div class="start-hero">🖼️</div>
    <h1>名画タイトル当て</h1>
    <p class="lead">著作権の切れた名画を見て、タイトルを当ててみてください。答え合わせのあとに本当の背景も解説します。全${WORKS.length}問。</p>
    <div class="card">
      <button class="primary" id="startBtn">はじめる</button>
    </div>
    <footer>画像出典：パブリックドメイン作品（Wikimedia Commons）</footer>
  `;
  document.getElementById('startBtn').onclick = () => { idx = 0; guesses = []; renderQuestion(); };
}

function renderQuestion(){
  const w = WORKS[idx];
  app.innerHTML = `
    <div class="progress">問題 ${idx+1} / ${WORKS.length}</div>
    <div class="card">
      <div class="frame" id="frame"></div>
      <input type="text" id="guessInput" placeholder="この絵のタイトル、何？" autocomplete="off" maxlength="${MAX_ANSWER_LEN}">
      <button class="primary" id="revealBtn">答え合わせ</button>
    </div>
  `;
  renderFrame(document.getElementById('frame'), w);
  document.getElementById('revealBtn').onclick = () => {
    const raw = document.getElementById('guessInput').value.trim();
    const val = raw || "（未回答）";
    guesses.push(val);
    if (raw) submitCommunityAnswer(w.id, raw);
    renderAnswer();
  };
  document.getElementById('guessInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ document.getElementById('revealBtn').click(); }
  });
}

function renderAnswer(){
  const w = WORKS[idx];
  const isLast = idx === WORKS.length - 1;
  app.innerHTML = `
    <div class="progress">問題 ${idx+1} / ${WORKS.length}</div>
    <div class="card">
      <div class="frame" id="frame"></div>
      <div class="your-guess">あなたの回答：${guesses[idx]}</div>
      <div class="answer-box">
        <div class="real-title">正解：${w.title}</div>
        <div class="meta">${w.artist} ／ ${w.year}</div>
        <div class="desc">${w.desc}</div>
      </div>
      ${db ? `<div class="community"><div class="community-title">みんなの回答</div><div class="community-list" id="communityList">読み込み中…</div></div>` : ''}
      <button class="primary" id="nextBtn">${isLast ? '結果を見る' : '次の絵へ'}</button>
    </div>
  `;
  renderFrame(document.getElementById('frame'), w);
  if (db) loadCommunityAnswers(w.id);
  document.getElementById('nextBtn').onclick = () => {
    if(isLast){ renderResult(); } else { idx++; renderQuestion(); }
  };
}

function renderResult(){
  const rows = WORKS.map((w,i)=>`
    <div class="row" style="justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line);">
      <span style="color:var(--sub)">${w.title}</span>
      <span>${guesses[i]}</span>
    </div>
  `).join('');
  app.innerHTML = `
    <div class="start-hero">🎉</div>
    <h1>おつかれさまでした</h1>
    <p class="lead">全${WORKS.length}問、回答一覧です。</p>
    <div class="card">
      ${rows}
      <button class="primary" id="restartBtn">もう一度あそぶ</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = renderStart;
}

renderStart();
</script>
</body>
</html>
