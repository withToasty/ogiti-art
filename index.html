<script>

// Firebaseプロジェクトを作成し、下記を実際の設定値に置き換えると有効になる。
// プレースホルダーのままなら db は null のままになり、機能全体が自動的に無効化される。

const MAX_ANSWER_LEN = 60;

let db = null;
try {
  if (FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY" && typeof firebase !== 'undefined') {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- シェア画像（美術館の解説プレート風）の生成 ----
const SHARE_CARD_W = 1080, SHARE_CARD_H = 1350;

function wrapCanvasText(ctx, text, maxWidth){
  const lines = [];
  let line = '';
  for (const ch of text) {
    const test = line + ch;
    if (line && ctx.measureText(test).width > maxWidth) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function fitGuessText(ctx, text, maxWidth, maxLines){
  const sizes = [56, 48, 40, 34];
  for (const size of sizes) {
    ctx.font = `700 ${size}px "Shippori Mincho", serif`;
    const lines = wrapCanvasText(ctx, text, maxWidth);
    if (lines.length <= maxLines) return { size, lines };
  }
  const size = sizes[sizes.length - 1];
  ctx.font = `700 ${size}px "Shippori Mincho", serif`;
  const lines = wrapCanvasText(ctx, text, maxWidth).slice(0, maxLines);
  let last = lines[maxLines - 1] || '';
  while (last.length > 0 && ctx.measureText(last + '…').width > maxWidth) {
    last = last.slice(0, -1);
  }
  lines[maxLines - 1] = last + '…';
  return { size, lines };
}

function loadImageEl(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function generateShareCard(w, guessText){
  const W = SHARE_CARD_W, H = SHARE_CARD_H;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // 共有画像はサイトのテーマに関わらず常にライト配色で書き出す
  const cardBg = '#f7f3ec', ink = '#2b2620', sub = '#7a7267', accent = '#c8593a';

  ctx.fillStyle = cardBg;
  ctx.fillRect(0, 0, W, H);

  const imgAreaH = Math.round(H * 0.63);

  try {
    await Promise.all([
      document.fonts.load('700 56px "Shippori Mincho"'),
      document.fonts.load('400 32px "Noto Sans JP"'),
    ]);
  } catch {}

  if (w.image) {
    try {
      const img = await loadImageEl(w.image);
      const scale = Math.max(W / img.width, imgAreaH / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      const dx = (W - dw) / 2, dy = (imgAreaH - dh) / 2;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, imgAreaH);
      ctx.clip();
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.restore();
    } catch (e) {
      console.warn('failed to load image for share card', e);
    }
  }

  const padX = 64;
  let y = imgAreaH + 70;

  ctx.fillStyle = accent;
  ctx.fillRect(padX, y, 64, 6);
  y += 46;

  const { size, lines } = fitGuessText(ctx, `「${guessText}」`, W - padX * 2, 3);
  ctx.fillStyle = ink;
  ctx.textBaseline = 'alphabetic';
  const lineHeight = Math.round(size * 1.28);
  for (const line of lines) {
    y += lineHeight;
    ctx.font = `700 ${size}px "Shippori Mincho", serif`;
    ctx.fillText(line, padX, y);
  }
  y += 44;

  ctx.font = '400 30px "Noto Sans JP", sans-serif';
  ctx.fillStyle = sub;
  ctx.fillText(`正解：${w.title}`, padX, y);
  y += 42;
  ctx.font = '400 26px "Noto Sans JP", sans-serif';
  ctx.fillText(`${w.artist} ／ ${w.year}`, padX, y);

  ctx.font = '400 22px "Noto Sans JP", sans-serif';
  ctx.fillStyle = sub;
  ctx.fillText('名画タイトル当て — withtoasty.github.io/ogiti-art', padX, H - 44);

  return canvas;
}

function showShareCardModal(canvas, work){
  const dataUrl = canvas.toDataURL('image/png');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <img class="modal-preview" src="${dataUrl}" alt="シェア画像プレビュー">
      <div class="modal-actions">
        <button class="primary" id="modalShareBtn">シェアする</button>
        <button class="ghost" id="modalDownloadBtn">保存する</button>
        <button class="ghost" id="modalCloseBtn">閉じる</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('#modalCloseBtn').onclick = close;

  overlay.querySelector('#modalDownloadBtn').onclick = () => {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `ogiti-art-${work.id}.png`;
    a.click();
  };

  const shareBtn = overlay.querySelector('#modalShareBtn');
  if (!navigator.share) {
    shareBtn.remove();
  } else {
    shareBtn.onclick = async () => {
      try {
        const blob = await (await fetch(dataUrl)).blob();
        const file = new File([blob], `ogiti-art-${work.id}.png`, { type: 'image/png' });
        if (navigator.canShare && !navigator.canShare({ files: [file] })) {
          throw new Error('cannot share files on this device');
        }
        await navigator.share({ files: [file], text: '名画タイトル当て、あなたも遊んでみて', url: location.href });
      } catch (e) {
        console.warn('share failed', e);
      }
    };
  }
}

function hasLiked(docId){
  try { return localStorage.getItem('liked_' + docId) === '1'; } catch { return false; }
}
function markLiked(docId){
  try { localStorage.setItem('liked_' + docId, '1'); } catch {}
}

async function submitCommunityAnswer(workId, text){
  if (!db || !text) return;
  try {
    await db.collection('answers').add({
      workId,
      text: text.slice(0, MAX_ANSWER_LEN),
      likes: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {
    console.warn('failed to submit community answer', e);
  }
}

async function fetchCommunityAnswers(workId){
  if (!db) return [];
  try {
    const snap = await db.collection('answers').where('workId', '==', workId).limit(30).get();
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    list.sort((a, b) => (b.likes || 0) - (a.likes || 0));
    return list.slice(0, 5);
  } catch (e) {
    console.warn('failed to fetch community answers', e);
    return [];
  }
}

async function loadCommunityAnswers(workId){
  const listEl = document.getElementById('communityList');
  if (!listEl) return;
  const answers = await fetchCommunityAnswers(workId);
  if (answers.length === 0) {
    listEl.innerHTML = `<div class="community-empty">まだ回答がありません。最初の投稿者になろう。</div>`;
    return;
  }
  listEl.innerHTML = answers.map(a => `
    <div class="community-item">
      <span class="community-text">${escapeHtml(a.text)}</span>
      <button class="like-btn" data-id="${a.id}" ${hasLiked(a.id) ? 'disabled' : ''}>
        <span class="like-icon">${hasLiked(a.id) ? '❤️' : '🤍'}</span>
        <span class="like-count">${a.likes || 0}</span>
      </button>
    </div>
  `).join('');
  listEl.querySelectorAll('.like-btn').forEach(btn => {
    btn.onclick = async () => {
      const docId = btn.dataset.id;
      if (hasLiked(docId)) return;
      markLiked(docId);
      btn.disabled = true;
      btn.querySelector('.like-icon').textContent = '❤️';
      const countEl = btn.querySelector('.like-count');
      countEl.textContent = (parseInt(countEl.textContent, 10) || 0) + 1;
      try {
        await db.collection('answers').doc(docId).update({
          likes: firebase.firestore.FieldValue.increment(1)
        });
      } catch (e) {
        console.warn('failed to like', e);
      }
    };
  });
}

    hint: "イカロスは画面の端に脚だけしか描かれていない",
    desc: "太陽に近づきすぎて蝋の翼が溶け、海に落ちたイカロスの神話を描いているが、主役のはずのイカロスは画面右下に脚だけ小さく見える程度。農夫や羊飼いは誰も気にも留めていない構図が皮肉とされる。"
  },
  {
    id: "ophelia",
    image: "images/ophelia.jpg",
    title: "オフィーリア",
    artist: "ジョン・エヴァレット・ミレイ", year: "1851–52年",
    hint: "水に浮かぶ女性、状況だけでは物語が読めない",
    desc: "シェイクスピア『ハムレット』でハムレットに拒絶され、正気を失って川に落ち歌いながら溺れていくオフィーリアの場面。モデルの女性は実際に浴槽で長時間ポーズを取らされ、体調を崩したという逸話が残る。"
  },
  {
    id: "gulf-stream",
    image: "images/gulf-stream.jpg",
    title: "メキシコ湾流",
    artist: "ウィンズロー・ホーマー", year: "1899年",
    hint: "サメと嵐の中の男、状況は壮絶だが題名は地味",
    desc: "帆を失った小舟に横たわる黒人漁師をサメが取り囲む場面。遠くに見える竜巻や船影が助かるかどうかを暗示するのみで、結末は描かれていない。"
  },
  {
    id: "nightmare",
    image: "images/nightmare.jpg",
    title: "夢魔（The Nightmare）",
    artist: "ヘンリー・フューズリ", year: "1781年",
    hint: "悪魔と馬の頭が突然現れ、状況の説明がつかない",
    desc: "眠る女性の胸の上に悪夢の象徴である小鬼（インキュバス）が座り、カーテンの隙間から白目を剥いた馬が覗き込む場面。当時の「夢と性」に関する俗信を視覚化した作品とされる。"
  },
  {
    id: "liberty",
    image: "images/liberty.jpg",
    title: "民衆を導く自由の女神",
    artist: "ウジェーヌ・ドラクロワ", year: "1830年",
    hint: "女性が旗を掲げているが、実在の人物か寓意像か",
    desc: "1830年のフランス七月革命を題材にした作品で、中央の女性は実在の人物ではなく「自由」を擬人化した寓意像。半裸で描かれているのは古典彫刻の伝統を踏襲した表現とされる。"
  }
];

let idx = 0;
let guesses = [];
const app = document.getElementById('app');

function renderFrame(container, w){
  container.innerHTML = '';
  if (w.image) {
    const img = document.createElement('img');
    img.src = w.image;
    img.alt = w.title;
    img.loading = 'lazy';
    img.onerror = () => {
      img.remove();
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.innerHTML = `<b>🖼️</b>${w.hint}`;
      container.appendChild(ph);
    };
    container.appendChild(img);
  } else {
    container.innerHTML = `<div class="ph"><b>🖼️</b>${w.hint}</div>`;
  }
}

function renderStart(){
  app.innerHTML = `
    <div class="hero-banner">
      <img src="images/hero-banner.jpg" alt="" loading="lazy" onerror="this.parentElement.style.display='none'">
    </div>
    <h1>名画タイトル当て</h1>
    <p class="lead">著作権の切れた名画を見て、タイトルを当ててみてください。答え合わせのあとに本当の背景も解説します。全${WORKS.length}問。</p>
    <div class="card">
      <button class="primary" id="startBtn">はじめる</button>
    </div>
    <footer>画像出典：パブリックドメイン作品（Wikimedia Commons）</footer>
  `;
  document.getElementById('startBtn').onclick = () => { idx = 0; guesses = []; renderQuestion(); };
}

function renderQuestion(){
  const w = WORKS[idx];
  app.innerHTML = `
    <div class="progress">
      <div class="progress-label">問題 ${idx+1} / ${WORKS.length}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${((idx+1)/WORKS.length)*100}%"></div></div>
    </div>
    <div class="card">
      <div class="frame" id="frame"></div>
      <input type="text" id="guessInput" placeholder="この絵のタイトル、何？" autocomplete="off" maxlength="${MAX_ANSWER_LEN}">
      ${db ? `
        <label class="optin">
          <input type="checkbox" id="shareOptIn" ${shareOptIn ? 'checked' : ''}>
          この回答を「みんなの回答」に公開する
        </label>
      ` : ''}
      <button class="primary" id="revealBtn">答え合わせ</button>
    </div>
  `;
  renderFrame(document.getElementById('frame'), w);
  if (db) {
    document.getElementById('shareOptIn').onchange = (e) => {
      shareOptIn = e.target.checked;
      try { localStorage.setItem('shareOptIn', shareOptIn ? '1' : '0'); } catch {}
    };
  }
  document.getElementById('revealBtn').onclick = () => {
    const raw = document.getElementById('guessInput').value.trim();
    const val = raw || "（未回答）";
    guesses.push(val);
    if (raw && shareOptIn) submitCommunityAnswer(w.id, raw);
    renderAnswer();
  };
  document.getElementById('guessInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ document.getElementById('revealBtn').click(); }
  });
}

function renderAnswer(){
  const w = WORKS[idx];
  const isLast = idx === WORKS.length - 1;
  app.innerHTML = `
    <div class="progress">
      <div class="progress-label">問題 ${idx+1} / ${WORKS.length}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${((idx+1)/WORKS.length)*100}%"></div></div>
    </div>
    <div class="card">
      <div class="frame" id="frame"></div>
      <div class="your-guess">あなたの回答：${guesses[idx]}</div>
      <div class="answer-box">
        <div class="real-title">正解：${w.title}</div>
        <div class="meta">${w.artist} ／ ${w.year}</div>
        <div class="desc">${w.desc}</div>
      </div>
      <button class="ghost" id="shareCardBtn" type="button">画像でシェアする</button>
      ${db ? `<div class="community"><div class="community-title">みんなの回答</div><div class="community-list" id="communityList">読み込み中…</div></div>` : ''}
      <button class="primary" id="nextBtn">${isLast ? '結果を見る' : '次の絵へ'}</button>
    </div>
  `;
  renderFrame(document.getElementById('frame'), w);
  if (db) loadCommunityAnswers(w.id);
  document.getElementById('nextBtn').onclick = () => {
    if(isLast){ renderResult(); } else { idx++; renderQuestion(); }
  };
  document.getElementById('shareCardBtn').onclick = async (e) => {
    const btn = e.currentTarget;
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = '作成中…';
    try {
      const canvas = await generateShareCard(w, guesses[idx]);
      showShareCardModal(canvas, w);
    } catch (err) {
      console.warn('failed to generate share card', err);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  };
}

function renderResult(){
  const rows = WORKS.map((w,i)=>`
    <div class="row" style="justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line);">
      <span style="color:var(--sub)">${w.title}</span>
      <span>${guesses[i]}</span>
    </div>
  `).join('');

  const shareText = "名画のタイトルを当ててみた。真面目にいくつもりが、後半は大喜利になった。";
  const shareUrl = location.href;
  const xShareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`;
  const lineShareUrl = `https://line.me/R/msg/text/?${encodeURIComponent(shareText + '\n' + shareUrl)}`;

  app.innerHTML = `
    <div class="start-hero">🎉</div>
    <h1>おつかれさまでした</h1>
    <p class="lead">全${WORKS.length}問、回答一覧です。</p>
    <div class="card">
      ${rows}
      <div class="share-row">
        <a class="share-btn share-x" href="${xShareUrl}" target="_blank" rel="noopener">𝕏でシェア</a>
        <a class="share-btn share-line" href="${lineShareUrl}" target="_blank" rel="noopener">LINEでシェア</a>
        <button class="share-btn share-copy" id="copyLinkBtn" type="button">リンクをコピー</button>
      </div>
      <button class="primary" id="restartBtn">もう一度あそぶ</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = renderStart;
  document.getElementById('copyLinkBtn').onclick = async (e) => {
    const btn = e.currentTarget;
    try {
      await navigator.clipboard.writeText(shareUrl);
      btn.textContent = 'コピーしました';
    } catch {
      btn.textContent = 'コピーできませんでした';
    }
    setTimeout(() => { btn.textContent = 'リンクをコピー'; }, 2000);
  };
}

renderStart();
</script>
</body>
</html>
